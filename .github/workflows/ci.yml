name: Java CI Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ssavice-chat:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # 프로젝트의 docker-compose.yml을 읽기 위해

      - name: Make .env file
        run: |
          echo "KAFKA_SERVER_URL=${{ secrets.KAFKA_SERVER_URL }}" >> .env
          echo "CHAT_DB_URL=${{ secrets.CHAT_DB_URL }}" >> .env
          echo "CHAT_DB_USERNAME=${{ secrets.CHAT_DB_USERNAME }}" >> .env
          echo "CHAT_DB_PASSWORD=${{ secrets.CHAT_DB_PASSWORD }}" >> .env
          echo "CHAT_SERVER_ID1=${{ secrets.CHAT_SERVER_ID1 }}" >> .env
          cat .env

      # 핵심: 로컬의 docker-compose.yml 과 env 를 EC2로 복사
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml, .env"
          target: "~/Chat" # 파일이 전송될 EC2 내부 경로

      - name: EC2 접속 및 배포 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/Chat
            # 최신 이미지 Pull (도커 허브에서 가져옴)
            docker compose pull
            # 서버 재시작
            docker compose up -d
            # 불필요한 이미지 정리
            docker image prune -f